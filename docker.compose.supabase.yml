# Prepare the pinned upstream configuration with: node scripts/prepare-supabase.mjs
# Copy .env.supabase.example to .env.supabase and configure secrets first.
# Start: docker compose --env-file .env.supabase -f docker.compose.supabase.yml up -d
# Never use `down --volumes` on a database whose data you want to keep.
name: teamspace-supabase
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the public Supabase URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Generate the public anonymous key}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      BACKEND_PROVIDER: supabase
      NEXT_PUBLIC_BACKEND_PROVIDER: supabase
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_INTERNAL_URL: http://api-gw:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Generate the server key}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-teamspace-private}
      EMAIL_CONFIRMATION_REQUIRED: ${EMAIL_CONFIRMATION_REQUIRED:-true}
      PASSWORD_AUTH_ENABLED: ${PASSWORD_AUTH_ENABLED:-true}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      ROOT_ADMIN_UIDS: ${ROOT_ADMIN_UIDS:-}
      DEV_AUTO_JOIN_WORKSPACE_ID: ""
    depends_on:
      api-gw:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
include:
  - path:
      - ./.supabase/upstream/docker/docker-compose.yml
      - ./deploy/supabase.override.yml
    project_directory: ./.supabase/upstream/docker
    env_file: ${SUPABASE_COMPOSE_ENV_FILE:-./.env.supabase}
